name: Changeset check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changeset:
    # Version PRs consume changesets rather than add them.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      # Fails when the PR changes files but adds no changeset. For changes that
      # should not release, add one with `npx changeset --empty`.
      - run: npx changeset status --since=origin/main
